.email-remove-row{display:grid;place-items:center;width:24px;height:28px;flex-shrink:0;padding:0;color:#8b9793}

.email-row-error,.email-address-feedback{margin-top:4px;font-size:10px;line-height:1.5;color:#bb5547;overflow-wrap:anywhere}

/* Team is shown as a standalone work panel, without the home-page backdrop. */
.shell{background:#fff;grid-template-columns:48px 210px minmax(0,1fr)}
.team-panel{display:grid;grid-column:3;grid-template-columns:258px minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-width:0;min-height:0;margin:16px 12px 12px 0;overflow:hidden;background:#fff;border:1px solid #d5ddd9;border-left-color:#bdcdc5;box-shadow:-4px 0 12px #263b3110}

/* The original Cosmo-to-avatar path exposes the revised account menu. */
.chrome .cosmo-launcher{padding:5px 12px;margin-left:-12px;border:1px solid transparent;border-radius:8px;font:700 14px/1.5 Arial,"Segoe UI",sans-serif;color:#263238}
.chrome .cosmo-launcher:hover{background:#f1f6f3}
.chrome .cosmo-launcher.active{border-color:#c9e5d9;background:#e8f6ef;color:#00a47b}
.cosmo-panel{position:fixed;z-index:22;left:0;top:89px;bottom:0;width:258px;display:flex;flex-direction:column;background:#fff;border-right:1px solid #dfe3e8;box-shadow:3px 0 10px #263b3109}
.cosmo-toolbar{height:56px;min-height:56px;display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid #e1e5ec}
.cosmo-tokens{margin-right:auto;font:10px/1.4 Consolas,"Courier New",monospace;text-decoration:underline;color:#43627a;white-space:nowrap}
.cosmo-notifications{display:grid;place-items:center;color:#71808a}.cosmo-notifications svg{width:16px;height:16px}
.cosmo-account{display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:50%;flex-shrink:0}
.cosmo-account>.avatar{width:30px;height:30px;border-radius:50%}
.cosmo-account[aria-expanded="true"]{border-color:#afd7c6}
.cosmo-panel-content{flex:1;min-height:0}
.cosmo-bottom-nav{display:flex;justify-content:space-around;gap:2px;border-top:1px solid #e1e5ec;background:#fbfcfb;padding:8px 5px 10px;color:#81918d}
.cosmo-bottom-nav>span{display:flex;flex:1;align-items:center;flex-direction:column;padding:4px 2px;font-size:15px;border-radius:6px}
.cosmo-bottom-nav>span.active{background:#e8f6ef;color:#009b72}
.cosmo-bottom-nav small{font:9px/1.5 Arial,"Segoe UI",sans-serif}
.account-menu{position:absolute;z-index:23;top:52px;right:12px;width:234px;padding:4px 0;background:#fbfaf6;border:1px solid #aca696;border-radius:2px;box-shadow:2px 3px 0 #00000018;font-family:Consolas,"Courier New",monospace;color:#25373e}
.account-menu-identity{display:flex;align-items:center;gap:9px;padding:9px 10px 10px;border-bottom:1px solid #dedbd0;margin-bottom:4px}
.account-menu-identity>.avatar{width:29px;height:29px;border-radius:3px}
.account-menu-identity>div{min-width:0;flex:1}
.account-menu-identity strong{display:block;font:700 12px/1.5 Consolas,"Courier New",monospace}
.account-menu-identity>div>span{display:block;font:10px/1.5 Consolas,"Courier New",monospace;color:#8b9793;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-menu-row{display:flex;align-items:center;gap:9px;width:100%;min-height:32px;padding:7px 10px;text-align:left;font:11px/1.5 Consolas,"Courier New",monospace;color:#25373e}
.account-menu-row svg{width:14px;height:14px}
.account-menu-row:hover,.account-menu-row:focus-visible{background:#edf3ee}
.account-menu hr{border:0;border-top:1px solid #dedbd0;margin:4px 9px}
.account-menu-row.sign-out{color:#c04736}

/* Group slug is a shared classification, with the original field name retained. */
.slug-chip{display:inline-flex;align-items:center;max-width:100%;padding:1px 6px;border:1px solid #d2e2d8;background:#eff6f1;color:#008d68;font-family:inherit;font-size:10px;line-height:1.6;border-radius:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;vertical-align:middle}
.slug-chip:hover{background:#e4f1e8;border-color:#accfbb}
.group-slug-fact{display:flex;align-items:center;gap:7px;min-width:0;margin-top:6px;font-size:10px;color:#8a94a4}
.group-slug-fact>span{flex-shrink:0}
.finder-modal .group-slug-fact{margin:3px 0;font:10px/1.5 Consolas,"Courier New",monospace;color:#8b9793}
.finder-modal .slug-chip{font:10px/1.6 Consolas,"Courier New",monospace;max-width:180px}
.finder-modal .finder-card{padding-bottom:10px}
.finder-slug-filter{display:flex;align-items:center;gap:7px;min-width:0;max-width:100%;width:max-content;margin:0 0 12px;padding:3px 5px 3px 9px;border:1px solid #c5ddcf;background:#edf5ee;font:11px/1.5 Consolas,"Courier New",monospace;color:#43665b}
.finder-slug-filter>span{flex-shrink:0}
.finder-slug-filter strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.finder-slug-filter .icon-btn{width:22px;height:22px;color:#608475}.finder-slug-filter svg{width:12px;height:12px}


.create-modal .create-input:has([data-slug-options]),.slug-input-wrap{position:relative}
.slug-input-wrap{display:flex;align-items:center;border:1px solid #e1e5ec;background:#fff}
.slug-input-wrap input{flex:1;min-width:0;border:0;border-radius:0}
.slug-toggle{flex-shrink:0;width:20px;height:24px;padding:0;color:#81918b;font-size:14px}
.slug-toggle:hover{color:#009b72}
.slug-options{position:absolute;z-index:5;left:-1px;right:-1px;top:calc(100% + 2px);max-height:155px;overflow:auto;border:1px solid #cec7b7;background:#fbfaf6;box-shadow:0 4px 12px #263b3114}
.slug-options[hidden]{display:none}
.slug-option{display:block;width:100%;text-align:left;padding:7px 11px;color:#425964;font:12px/1.5 Consolas,"Courier New",monospace;overflow-wrap:anywhere}
.slug-option:hover,.slug-option:focus-visible{background:#e8f3ec;color:#008d68;outline:none}
.slug-option[aria-selected="true"]{color:#008d68}

/* Blue only, wrapped in the H2-B "平时在用" frame: cool wash, frosted bar and rail, white content. */
:root{
  --ink:#000;--muted:#656d76;--faint:#71777d;--line:#e6e8ec;--line-strong:#d0d4d8;
  --green:#3c7a94;--green-dark:#316479;--mint:#ebf5fa;--green-bubble:#3c7a94;
  --green-mist:#f4f7f8;--green-line:#c5d6e0;--canvas:#eef1f3;--surface:#f1f2f4;
  --red:#a33b32;--sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
html,body{
  background:
    radial-gradient(880px 240px at 0 0, rgba(186,206,218,.55), transparent 68%),
    linear-gradient(180deg,#e4eaee 0%,#eef1f3 100%);
  color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,textarea,select{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.mono{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.demo-tools,.chrome,.shell{min-width:0}
.demo-tools{height:40px;padding:0 16px;background:rgba(255,255,255,.92);color:var(--muted);border-bottom:0;font-size:12px;backdrop-filter:blur(22px) saturate(1.45)}
.demo-tools strong{font-size:13px;font-weight:600;color:var(--ink)}
.demo-tools .demo-note{color:var(--faint);font-size:12px}
.demo-tools select,.demo-tools button{min-height:26px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px}
.demo-tools button:hover,.demo-tools select:hover{background:var(--green-mist)}
.demo-tools .sep{border-color:var(--line)}
.chrome{height:48px;padding:0 20px;gap:12px;background:rgba(255,255,255,.46);border-bottom:0;color:#5f6368;font-size:13px;backdrop-filter:blur(22px) saturate(1.45);-webkit-backdrop-filter:blur(22px) saturate(1.45)}
.chrome .cosmo-launcher{margin:0;padding:6px 10px;border-radius:8px;font:600 14px/1 var(--sans);color:#1f1f1f}
.chrome .cosmo-launcher:hover,.chrome .cosmo-launcher.active{background:#ececee;border-color:transparent;color:#1f1f1f}
.chrome .desk-pill{width:24px;height:24px;padding:0;display:inline-grid;place-items:center;background:#fff;border:1px solid #e6e6e8;color:#5f6368;border-radius:12px;font-size:11px;font-weight:600}
.chrome strong{font-weight:600;letter-spacing:.16em;font-size:14px;color:#1f1f1f}
.shell{height:calc(100vh - 88px);margin:0;border:0;border-radius:0;overflow:hidden;background:transparent;box-shadow:none;grid-template-columns:52px minmax(0,1fr)}
.rail{width:52px;height:100%;gap:8px;padding:14px 8px;background:rgba(255,255,255,.46);border-right-color:transparent;color:#5f6368;justify-content:flex-start;backdrop-filter:blur(22px) saturate(1.45);-webkit-backdrop-filter:blur(22px) saturate(1.45)}
.rail .avatar{margin-top:0 !important}
.rail .avatar[style*="margin-top"]{margin-top:auto !important}
.rail span{width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
.rail .active{background:#ececee;color:#1f1f1f;padding:0}
.rail span:hover{background:#ececee;color:#1f1f1f}
.team-panel{grid-column:2;margin:0;border:0;border-radius:0;box-shadow:none;background:#fff;grid-template-columns:300px minmax(0,1fr)}
.sidebar{padding:16px 12px 12px;background:#fff}
.identity{padding:4px 8px 14px}
.identity strong{font-size:14px;font-weight:600}
.identity p{font-size:12px;color:var(--muted)}
.desk-nav{padding:8px 4px 12px;gap:2px;border-color:var(--line)}
.desk-nav>span{padding:6px 8px;border-radius:8px;color:var(--muted);font-size:12px;font-weight:500}
.my-team-title{margin:14px 8px 8px;font-size:22px;font-weight:500;letter-spacing:-.3px}
.list-head{padding:8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.list-head .count{background:var(--surface);color:var(--muted);border-radius:999px}
.list-empty,.hidden-note{font-size:12px;color:var(--muted)}
.search-wrap{margin:4px 4px 12px}
.search-wrap input{height:36px;border:0;border-radius:999px;background:var(--surface);font-size:13px}
.search-wrap .add{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--green-dark);font-size:18px}
.search-wrap .add:hover{background:var(--green-mist);border-color:var(--green-line)}
.conversation{min-height:64px;padding:8px;border-radius:12px;gap:10px}
.conversation:hover{background:rgba(28,31,29,.04)}
.conversation.selected{background:var(--mint)}
.conversation .name{font-size:14px;font-weight:600}
.conversation .preview,.conversation .time{font-size:12px;color:var(--muted)}
.conversation .more{opacity:0;border-radius:6px;background:#fff;color:var(--muted)}
.conversation:hover .more,.conversation.selected .more,.conversation:focus-within .more{opacity:1}
.activity-dot{width:8px;height:8px;background:var(--green);box-shadow:0 0 0 3px var(--mint)}
.avatar{border-radius:50%}
.group-avatar{border-radius:10px;overflow:hidden}
.avatar{font-weight:650}
.workarea{padding:0;background:#fff}
.chat-top{height:64px;margin:0;padding:0 16px;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.group-title .title{font-size:16px;font-weight:600;max-width:360px}
.top-static{border-radius:999px;background:var(--surface);border-color:transparent;color:var(--muted);font-size:12px;padding:4px 10px}
.top-static:hover{background:var(--mint);color:var(--green-dark)}
.messages{padding:28px 28px 12px}
.date-divider{font-size:12px;color:var(--faint)}
.bubble{background:var(--surface);color:var(--ink);border-radius:4px 16px 16px 16px;font-size:14px;line-height:1.55}
.own .bubble{background:var(--green-bubble);color:#fff;border-radius:16px 4px 16px 16px}
.message-meta strong{font-weight:600}
.composer{margin:0 16px 16px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.composer textarea{border:0;border-radius:12px;font-size:14px;min-height:52px;height:52px}
.composer-actions .send{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff}
.composer-actions .send:disabled{background:#d5d8dc;color:#fff}
.empty-chat h2{font-weight:500;letter-spacing:-.3px;color:var(--ink)}
.empty-chat .quiet-icon{border-radius:16px;background:var(--mint);color:var(--green-dark)}
.member-drawer{background:#fff;border-color:var(--line);margin-left:0;padding:18px 16px 16px}
.drawer-header{font-size:15px;font-weight:600}
.group-facts{border-color:var(--line)}
.group-facts strong{font-size:16px}
.group-facts p,.group-facts .number{font-size:13px}
.member-search{height:36px;border:0;border-radius:999px;background:var(--surface);padding:0 12px}
.member-row{border-radius:10px}
.member-row:hover{background:var(--green-mist)}
.member-row .person-name{font-size:14px;font-weight:600}
.slug-chip{border-radius:999px;background:var(--mint);border-color:var(--green-line);color:var(--green-dark);font-family:var(--sans);font-size:11px;font-weight:600}
.btn{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:34px;font-size:13px;font-weight:600}
.btn:hover{background:var(--green-mist)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dark)}
.btn.danger{color:var(--red)}
.icon-btn{border-radius:8px}
.icon-btn:hover{background:var(--green-mist);color:var(--green-dark)}
.modal-overlay{inset:88px 0 0;background:rgba(28,31,29,.28);backdrop-filter:none}
.modal{width:480px;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(70,100,90,.16);font-family:var(--sans)}
.modal.wide{width:640px}.modal.narrow{width:440px}
.modal-header h2{font-size:18px;font-weight:600;color:var(--ink)}
.modal-header p,.field label,.section-title,.sidenote{font-family:var(--sans);color:var(--muted)}
.modal-footer{background:#fff}
.tabs button.active{color:var(--green-dark);border-bottom-color:var(--green)}
.modal.finder-modal{width:440px;height:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--ink);font-family:var(--sans);box-shadow:0 16px 40px rgba(70,100,90,.16)}
.modal.create-modal{width:440px;height:auto;max-height:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--ink);font-family:var(--sans);box-shadow:0 16px 40px rgba(70,100,90,.16)}
.finder-modal .modal-header,.create-modal .modal-header{padding:16px 16px 8px;border:0}
.finder-modal .modal-header>.icon-btn,.create-modal .modal-header>.icon-btn{display:grid;place-items:center}
.create-modal .modal-header>div{position:static;width:auto;height:auto;margin:0;padding:0;overflow:visible;clip:auto;white-space:normal}
.finder-modal .modal-header h2,.create-modal .modal-header h2{color:var(--ink);font-size:18px;font-weight:600;letter-spacing:0}
.finder-modal .modal-header p{color:var(--muted);font-size:13px;letter-spacing:0}
.finder-modal .search-box{height:40px;border:0;border-radius:999px;background:var(--surface)}
.finder-modal .search-box input{font:14px/1.4 var(--sans);color:var(--ink);background:transparent}
.finder-modal .section-title,.create-modal .section-title{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.finder-modal .finder-card{padding:10px 8px;border-radius:12px;align-items:center}
.finder-modal .finder-card:hover{background:var(--green-mist)}
.finder-modal .finder-card h3,.finder-modal .finder-name,.finder-modal .finder-card .meta,.finder-modal .finder-card p,.finder-modal .group-slug-fact,.finder-slug-filter,.create-modal .create-agent strong,.create-modal .create-agent-sub{font-family:var(--sans);letter-spacing:0}
.finder-modal .finder-card h3{font-size:14px}
.finder-modal .finder-card .meta,.finder-modal .finder-card p{color:var(--muted);font-size:12px}
.finder-modal .group-avatar{width:40px;height:40px;clip-path:none;border-radius:10px;padding:2px;gap:1px;background:var(--line)}
.finder-modal .group-avatar span{font-size:8px;color:#fff;border-radius:2px}
.finder-modal .finder-action .btn{width:auto;min-width:84px;height:32px;border:0;border-radius:999px;background:var(--green);color:#fff;font:600 12px/1 var(--sans)}
.finder-modal .finder-action .btn:hover:not(:disabled){background:var(--green-dark)}
.finder-modal .finder-action .btn:disabled{background:var(--surface);color:var(--muted);opacity:1}
.finder-modal .new-group{height:40px;border:1px dashed var(--green-line);border-radius:12px;color:var(--green-dark);background:var(--green-mist);font:600 13px/1 var(--sans);letter-spacing:0}
.finder-modal .new-group:hover{background:var(--mint)}
.finder-modal .modal-footer .btn,.create-modal .modal-footer .btn{height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:600 13px/1 var(--sans);letter-spacing:0}
.finder-modal .modal-footer .btn:hover,.create-modal .modal-footer .create-cancel:hover{background:var(--green-mist);color:var(--ink)}
.create-modal .modal-footer .primary{background:var(--green);border-color:var(--green);color:#fff;min-width:96px}
.create-modal .modal-footer .primary:hover{background:var(--green-dark);color:#fff}
.finder-slug-filter{border-radius:999px;background:var(--mint);border-color:var(--green-line);font-family:var(--sans);color:var(--green-dark)}
.create-modal .create-input,.create-modal textarea,.create-modal .create-agent,.create-modal .email-address-controls input{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.create-modal .create-input input,.create-modal textarea,.create-modal .email-address-controls input{font:14px/1.4 var(--sans);color:var(--ink)}
.create-modal .create-input input{border:0;background:transparent}
.create-modal .create-agent .avatar{border-radius:50%}
.create-modal .error{font-family:var(--sans);font-size:12px}
.slug-options{border-radius:10px;border-color:var(--line);background:#fff}
.slug-option{font-family:var(--sans);font-size:13px}
.slug-input-wrap{border-radius:10px;border-color:var(--line)}
.email-add-row{border-radius:8px;border-color:var(--line);color:var(--green-dark)}
.cosmo-panel{top:88px;border-right:1px solid var(--line);box-shadow:8px 0 24px rgba(28,31,29,.06)}
.cosmo-tokens,.cosmo-bottom-nav small{font-family:var(--sans);color:var(--muted);text-decoration:none}
.account-menu{top:52px;width:260px;padding:6px;border-radius:12px;border:1px solid var(--line);background:#fff;box-shadow:0 10px 28px rgba(20,24,28,.12);font-family:var(--sans);color:var(--ink)}
.account-menu-identity{border-bottom-color:var(--line)}
.account-menu-identity>.avatar{border-radius:50%}
.account-menu-identity strong,.account-menu-identity>div>span,.account-menu-row{font-family:var(--sans);letter-spacing:0}
.account-menu-identity strong{font-size:13px;font-weight:600}
.account-menu-identity>div>span{font-size:12px;font-weight:400;color:var(--muted)}
.account-menu-row{min-height:34px;font-size:13px;font-weight:500;border-radius:8px}
.account-menu-row:hover,.account-menu-row:focus-visible{background:var(--green-mist)}
.account-menu hr{border-top-color:var(--line)}
.context-menu{width:260px;border-radius:12px;border-color:var(--line);box-shadow:0 10px 28px rgba(20,24,28,.12);padding:6px}
.context-menu button{border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.context-menu button:hover{background:var(--green-mist);color:var(--ink)}
.context-menu button.danger,.context-menu button.danger:hover{color:var(--red)}
.context-menu button.danger:hover{background:#fdecea}
.toast{border-radius:12px;background:#1c1f1d}
.info-card,.admin-person,.request-card,.link-record,.copy-preview,.option-row,.guide-step{border-radius:12px}
.tag.green{border-radius:999px}
.text-btn,.slug-toggle:hover,.email-add-row,.hidden-note button{color:var(--green)}
.tag.green{color:var(--green-dark);background:var(--mint);border-color:var(--green-line)}

<script>

Object.assign(paths,{profile:'M20 21v-2a7 7 0 0 0-14 0v2 M17 7a4 4 0 1 1-8 0a4 4 0 0 1 8 0',edit:'M13 4H4v17h16V11 M17 2l5 5-10 10-5 1 1-5z',shield:'M12 2l9 4v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6',globe:'M21 12a9 9 0 1 1-18 0a9 9 0 0 1 18 0 M3 12h18 M12 3c5 4 5 14 0 18 M12 3c-5 4-5 14 0 18',info:'M21 12a9 9 0 1 1-18 0a9 9 0 0 1 18 0 M12 10v7 M12 7h.01',history:'M3 4v6h6 M3 10a9 9 0 1 1 1 8 M12 7v6l4 2'});

const people={u1:{name:'Alex Lin',email:'linyi@example.com',color:'#e6ddec',title:'Product design'},u2:{name:'Nina Zhou',email:'zhouning@example.com',color:'#e7ddcb',title:'Project lead'},u3:{name:'Iris Shen',email:'shenyue@example.com',color:'#d8e6e9',title:'Researcher'},u4:{name:'Evan Chen',email:'chenyu@example.com',color:'#d8e9d9',title:'Product research'},u5:{name:'Zoe Xu',email:'xuzhi@example.com',color:'#e7dcd4',title:'Collaborator'},citta:{name:'Citta',email:'',color:'#d7e7d0',title:'Super agent'}};
function seed(){return{slugModel:1,uid:'u1',seq:12,nextId:81003205,groups:[
 {id:'g1',num:'81003201',name:'Product Team',slug:'work',intro:'Product plans, interface feedback and review schedules for Team. Keep every decision and next step in context.',owner:'u1',members:['u1','u2','u3','citta'],policy:'approval',listed:true,messages:[{id:1,from:'u2',text:'Let us review the group invitation and joining flows this week.',time:'09:41'},{id:2,from:'u1',text:'I will include direct messaging and group numbers in the demo.',time:'09:43'},{id:3,from:'u3',text:'Searching the member list would make it easier to find a colleague.',time:'09:46'}],requests:[{id:'rq0',user:'u4',reason:'I would like to help with product research and reviews for Team.',status:'pending'}],links:[{id:'inv-start',by:'u1',status:'active'},{id:'inv-old',by:'u1',status:'revoked'}],emails:[]},
 {id:'g2',num:'81003202',name:'Paper Discussion',slug:'research',intro:'Discuss research topics, reading notes and revisions. Share a weekly summary of decisions.',owner:'u2',members:['u2','u1','u3'],policy:'approval',listed:true,messages:[{id:4,from:'u2',text:'Please share your reading notes before our next discussion.',time:'10:12'},{id:5,from:'u3',text:'Sounds good. I will start with the methods section.',time:'10:15'}],requests:[],links:[],emails:[]},
 {id:'g3',num:'81003203',name:'Project Kickoff',slug:'work',intro:'A place to prepare our next project. You have joined this group; there are no messages yet.',owner:'u1',members:['u1','u2'],policy:'approval',listed:true,messages:[],requests:[],links:[],emails:[]},
 {id:'g4',num:'81003204',name:'ML Reading Group',slug:'research',intro:'Read machine learning papers together and exchange methods, experiments and practical experience. Interested colleagues are welcome to request to join.',owner:'u3',members:['u3','u2'],policy:'approval',listed:true,messages:[{id:6,from:'u3',text:'Welcome to the reading group. We are discussing research methods this week.',time:'11:00'}],requests:[],links:[{id:'inv-reading',by:'u3',status:'active'}],emails:[]}
 ],dms:[{id:'dm-u1-u2',members:['u1','u2'],messages:[{id:7,from:'u2',text:'Can we review the flow together before the design review?',time:'Yesterday'},{id:8,from:'u1',text:'Sure. I will send it over when it is ready.',time:'Yesterday'}]}],prefs:{},view:{type:'group',id:'g1'}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed();if(!state.groups||!state.uid)state=seed()}catch{state=seed()}
// Update only the untouched sample classifications when loading an older demo.
if(!state.slugModel){
 const sampleSlugs={g1:['product-team','work'],g2:['paper-discussion','research'],g3:['new-project','work'],g4:['ml-reading','research']};
 for(const g of state.groups){const sample=sampleSlugs[g.id];if(sample&&g.slug===sample[0])g.slug=sample[1]}
 state.slugModel=1
}
let cosmoOpen=false,accountMenuOpen=false;
let modal=null,drawer=false,modalTab='overview',memberFold=false,search='',memberQuery='',memberAdminQuery='',finderQuery='',finderSlug='',toastTimer=null,context=null,lastFocus=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
const current=()=>people[state.uid];
const group=id=>state.groups.find(g=>g.id===id);
const dm=id=>state.dms.find(d=>d.id===id);
const currentConv=()=>state.view.type==='group'?group(state.view.id):dm(state.view.id);
const canManage=g=>!!g&&g.members.includes(state.uid)&&(g.owner===state.uid||g.roles?.[state.uid]==='Admin');
const isMember=g=>g?.members.includes(state.uid);
const pending=g=>g.requests.filter(r=>r.status==='pending');
function normalizeSlug(value){return String(value??'').trim().replace(/\s+/g,' ')}
function slugKey(value){return normalizeSlug(value).toLowerCase()}
function visibleGroups(){return state.groups.filter(g=>isMember(g)||g.listed)}
function availableSlugs(){
 const unique=new Map();for(const g of visibleGroups()){const value=normalizeSlug(g.slug);if(value&&!unique.has(slugKey(value)))unique.set(slugKey(value),value)}
 return [...unique.values()].sort((a,b)=>a.localeCompare(b))
}
function canonicalSlug(value){const normalized=normalizeSlug(value);return availableSlugs().find(slug=>slugKey(slug)===slugKey(normalized))||normalized}
function slugOptionsHTML(id){return `<div class="slug-options" id="${id}" role="listbox" aria-label="Existing Group slugs" hidden></div>`}
function slugToggleHTML(inputId){return `<button class="slug-toggle" type="button" data-action="toggle-slug-options" data-input="${inputId}" aria-label="Choose existing Group slug" title="Choose existing Group slug">⌄</button>`}
function closeSlugOptions(){
 document.querySelectorAll('.slug-options').forEach(el=>el.hidden=true);
 document.querySelectorAll('[data-slug-options]').forEach(el=>el.setAttribute('aria-expanded','false'))
}
function showSlugOptions(input,all=false){
 const root=document.getElementById(input.dataset.slugOptions);if(!root)return;
 const q=slugKey(input.value),values=availableSlugs().filter(value=>all||!q||slugKey(value).includes(q));
 root.innerHTML=values.map(value=>`<button class="slug-option" type="button" role="option" aria-selected="${slugKey(value)===q}" data-action="choose-slug" data-input="${input.id}" data-value="${esc(value)}">${esc(value)}</button>`).join('');
 root.hidden=!values.length;input.setAttribute('aria-expanded',String(!!values.length))
}
document.addEventListener('focusin',e=>{if(e.target.dataset.slugOptions)showSlugOptions(e.target)});
document.addEventListener('input',e=>{if(e.target.dataset.slugOptions)showSlugOptions(e.target)});
document.addEventListener('click',e=>{if(!e.target.closest('.slug-options,.slug-toggle,[data-slug-options]'))closeSlugOptions()});
document.addEventListener('keydown',e=>{
 const input=e.target.dataset.slugOptions?e.target:null,option=e.target.closest('.slug-option');
 if(e.key==='Escape'&&((input&&input.getAttribute('aria-expanded')==='true')||option)){
  e.preventDefault();e.stopPropagation();const target=input||document.getElementById(option.dataset.input);target?.focus();closeSlugOptions();return
 }
 if(input&&e.key==='ArrowDown'){e.preventDefault();showSlugOptions(input);document.getElementById(input.dataset.slugOptions)?.querySelector('.slug-option')?.focus();return}
 if(option&&['ArrowDown','ArrowUp'].includes(e.key)){
  e.preventDefault();const options=[...option.parentElement.querySelectorAll('.slug-option')],index=options.indexOf(option),delta=e.key==='ArrowDown'?1:-1;options[(index+delta+options.length)%options.length]?.focus()
 }
},true);
function slugChip(g){const value=normalizeSlug(g.slug);return value?`<button class="slug-chip" type="button" data-action="filter-slug" data-slug="${esc(value)}" aria-label="Find groups with Group slug ${esc(value)}" title="Group slug: ${esc(value)}">${esc(value)}</button>`:''}
function groupSlugFacts(g){return normalizeSlug(g.slug)?`<div class="group-slug-fact"><span>Group slug</span>${slugChip(g)}</div>`:''}
function finderFilterHTML(){return finderSlug?`<div class="finder-slug-filter" role="group" aria-label="Active Group slug filter"><span>Group slug:</span><strong title="${esc(finderSlug)}">${esc(finderSlug)}</strong><button class="icon-btn" type="button" data-action="clear-slug-filter" aria-label="Clear Group slug filter">${icon('close')}</button></div>`:''}
function finderHeading(){return finderQuery.trim()||finderSlug?'SEARCH RESULTS':'RECOMMENDED'}
function pref(type,id){const key=state.uid+':'+type+':'+id;return state.prefs[key]||(state.prefs[key]={hidden:false,pinned:false,unread:false,muted:false,cutoff:0})}
function avatar(id,size=''){const p=people[id];return `<span class="avatar ${size}" style="--av:${p.color}">${esc(id==='citta'?'✦':p.name.split(' ').map(n=>n[0]).join(''))}</span>`}
function groupAvatar(g){return `<span class="group-avatar">${g.members.slice(0,4).concat(Array(4).fill(null)).slice(0,4).map(id=>`<span>${id?esc(id==='citta'?'✦':people[id].name.split(' ').map(n=>n[0]).join('')):''}</span>`).join('')}</span>`}
function convName(type,c){return type==='group'?c.name:people[c.members.find(id=>id!==state.uid)].name}
function visibleMessages(type,c){return(c.messages||[]).filter(m=>m.id>pref(type,c.id).cutoff)}
function countRequests(){return state.groups.filter(g=>canManage(g)).reduce((n,g)=>n+pending(g).length,0)}
function render(persist=true){if(persist)save();renderTools();renderSidebar();renderChat();if(modal)renderModal();else document.querySelector('#modal-root').innerHTML='';renderMenu()}
function renderTools(){const sel=document.querySelector('#demo-user');sel.innerHTML=['u1','u2','u3','u4'].map(id=>`<option value="${id}" ${id===state.uid?'selected':''}>${people[id].name}</option>`).join('');renderCosmo()}
function accountMenuHTML(){
 const first=[['edit','Edit profile'],['profile','Profile picture']];
 const settings=[['shield','Security & privacy'],['settings','Account & settings'],['globe','Connected apps']];
 const second=[['info','About Symbion'],['history','Recent history']];
 const rows=items=>items.map(([ic,label])=>`<button class="account-menu-row" type="button" role="menuitem">${icon(ic)}<span>${label}</span></button>`).join('');
 return `<div class="account-menu" role="menu" aria-label="Account menu"><div class="account-menu-identity">${avatar(state.uid,'small')}<div><strong>${esc(current().name)}</strong><span>${esc(current().email)}</span></div></div>${rows(first)}<hr>${rows(settings)}<hr>${rows(second)}<hr><button class="account-menu-row sign-out" type="button" role="menuitem">${icon('logout')}<span>Sign out</span></button></div>`

function renderCosmo(){
 const launcher=document.querySelector('#cosmo-launcher'),root=document.querySelector('#cosmo-root');
 launcher.setAttribute('aria-expanded',String(cosmoOpen));launcher.classList.toggle('active',cosmoOpen);
 root.innerHTML=cosmoOpen?`<aside class="cosmo-panel" aria-label="Cosmo panel"><div class="cosmo-toolbar"><span class="cosmo-tokens">128,000 tokens left</span><span class="cosmo-notifications" aria-hidden="true">${icon('bell')}</span><button class="cosmo-account" data-action="account-menu-toggle" aria-label="Open account menu" aria-haspopup="menu" aria-expanded="${accountMenuOpen}">${avatar(state.uid,'small')}</button></div><div class="cosmo-panel-content"></div><div class="cosmo-bottom-nav" aria-hidden="true"><span class="active">✦<small>Cosmo</small></span><span>▧<small>Post</small></span><span>♧<small>Community</small></span><span>♙<small>Settings</small></span></div>${accountMenuOpen?accountMenuHTML():''}</aside>`:''
}
function rowConv(type,c){
 const p=pref(type,c.id),msgs=visibleMessages(type,c),last=msgs.at(-1),name=convName(type,c),selected=state.view.type===type&&state.view.id===c.id;
 const rq=type==='group'&&canManage(c)?pending(c).length:0;
 const activity=[p.unread?'Unread messages':'',rq?`${rq} pending join request${rq===1?'':'s'}`:''].filter(Boolean).join(' · ');
 const preview=rq?`${rq} pending join request${rq===1?'':'s'}`:last?people[last.from].name+' · '+last.text:'No messages yet';
 return `<button class="conversation ${selected?'selected':''}" data-action="open-conv" data-type="${type}" data-id="${c.id}" aria-label="Open ${type==='group'?'group':'DM'} ${esc(name)}" data-context-type="${type}" data-context-id="${c.id}">${type==='group'?groupAvatar(c):avatar(c.members.find(id=>id!==state.uid))}<span class="grow"><span class="name-line"><span class="name">${esc(name)}</span><span class="markers">${p.pinned?icon('pin'):''}${p.muted?icon('mute'):''}</span>${activity?`<span class="activity-dot" role="status" aria-label="${esc(activity)}" title="${esc(activity)}"></span>`:`<span class="time">${last?esc(last.time):''}</span>`}</span><span class="preview">${esc(preview)}</span></span><span class="more" role="button" tabindex="0" aria-label="${esc(name)} conversation actions" data-action="context" data-type="${type}" data-id="${c.id}">···</span></button>`
}
function renderSidebar(){const groups=state.groups.filter(isMember),dms=state.dms.filter(d=>d.members.includes(state.uid));const matches=(type,c)=>convName(type,c).toLowerCase().includes(search.trim().toLowerCase())||(type==='group'&&(c.num.includes(search.trim())||slugKey(c.slug).includes(slugKey(search))));const needsReview=g=>canManage(g)&&pending(g).length>0;const sorted=(type,cs)=>cs.filter(c=>(!pref(type,c.id).hidden||(type==='group'&&needsReview(c)))&&matches(type,c)).sort((a,b)=>Number(pref(type,b.id).pinned)-Number(pref(type,a.id).pinned));const gs=sorted('group',groups),ds=sorted('dm',dms),hidden=groups.filter(g=>pref('group',g.id).hidden&&!needsReview(g)).length+dms.filter(d=>pref('dm',d.id).hidden).length;document.querySelector('#sidebar').innerHTML=`<div class="identity">${avatar(state.uid)}<div><strong>${esc(current().name)}</strong><p>${esc(current().email)}</p></div></div><div class="desk-nav" aria-hidden="true"><span>${icon('calendar')} Kanban</span><span>${icon('mail')} Email</span><span>${icon('folder')} Ledger</span><span>${icon('folder')} Super Drive</span><span>My Cosmo</span></div><div class="my-team-title">My Team</div><div class="list-head">Team <span class="count badge" title="Groups you have joined, including hidden conversations">${groups.length}</span><span class="fold">⌄</span></div><div class="search-wrap">${icon('search')}<input id="list-search" aria-label="Search your conversations" title="Search by name, group number or Group slug" placeholder="Search" value="${esc(search)}"><button class="add" data-action="finder" aria-label="Find or create a group">＋</button></div><div>${gs.map(g=>rowConv('group',g)).join('')||`<div class="list-empty">${search?'No matching groups':'No groups yet. Click + to find or create one.'}</div>`}</div><div class="list-head dm-heading">Direct Messages <span class="count badge">${dms.length}</span><span class="fold">⌄</span></div><div>${ds.map(d=>rowConv('dm',d)).join('')||'<div class="list-empty">Start a DM from a group member list.</div>'}</div>${hidden?`<div class="hidden-note">${hidden}  hidden conversations · <button data-action="hidden">View</button></div>`:''}`}

function invitationEmails(raw,existing=[],memberIds=[]){
 const seen=new Set(existing.map(email=>email.toLowerCase())),members=new Set(memberIds.map(id=>people[id]?.email.toLowerCase()).filter(Boolean));
 const ready=[],invalid=[];let skipped=0;
 for(const email of emailEntries(raw)){
  if(!validEmail(email)){invalid.push(email);continue}
  if(seen.has(email)||members.has(email)){skipped++;continue}
  seen.add(email);ready.push(email)
 }
 return {ready,invalid:[...new Set(invalid)],skipped}
}

 <div class="manage-leave-row"><button class="btn danger" data-action="leave" data-id="${g.id}">Leave group</button></div>`;
 else if(modalTab==='requests')body=`<p class="sidenote" style="margin-bottom:15px">Opening the conversation does not dismiss join requests.</p>${g.requests.length?g.requests.map(r=>`<div class="request-card"><div class="row">${avatar(r.user)}<div class="grow"><strong>${esc(people[r.user].name)}</strong><div class="tiny muted">${esc(people[r.user].title)}</div></div><span class="tag ${r.status==='approved'?'green':''}">${r.status==='pending'?'Pending':r.status==='approved'?'Approved':'Denied'}</span></div><p class="request-reason">${esc(r.reason)||'I would like to join this group.'}</p>${r.status==='pending'?`<div class="request-actions"><button class="btn small" data-action="resolve-request" data-id="${r.id}" data-result="rejected">Deny</button><button class="btn small primary" data-action="resolve-request" data-id="${r.id}" data-result="approved">Approve</button></div>`:''}</div>`).join(''):'<div class="compact-empty">No join requests yet.</div>'}`;
 else body=`<section class="manage-section"><div id="manage-email-editor">${emailEditorHTML('manage')}</div>${g.emails.map(e=>`<div class="email-item">${icon('mail')}<span>${esc(e.email)}</span><span>${isEmailAccepted(e,g)?'Joined':'Pending'}</span></div>`).join('')}</section><section class="manage-section"><div class="row spread"><strong>Invite links</strong><button class="btn small primary" data-action="create-link" data-id="${g.id}">Create link</button></div><p class="sidenote" style="margin-top:10px">Copy the complete invitation, including the group name, number and description.</p>${g.links.length?g.links.map(l=>`<div class="link-record ${l.status==='revoked'?'revoked':''}"><div class="row spread"><span class="link-id">invite / ${esc(l.id)}</span><span class="tag ${l.status==='active'?'green':''}">${l.status==='active'?'Active':'Revoked'}</span></div><div class="link-meta">Created by ${esc(people[l.by].name)} · ${l.status==='active'?'Uses current join policy':'No longer valid'}</div><div class="invite-buttons">${l.status==='active'?`<button class="btn small" data-action="preview-link" data-id="${l.id}">Preview</button><button class="btn small" data-action="copy-invite" data-id="${l.id}">${icon('copy')} Copy invitation</button><button class="btn small" data-action="revoke-link" data-id="${l.id}">Revoke</button>`:`<button class="btn small" data-action="delete-link" data-id="${l.id}">Delete record</button>`}</div></div>`).join(''):'<div class="compact-empty" style="margin-top:14px">No invite links yet.</div>'}</section>`;
 return modalFrame('Group Management · '+esc(g.name),'Members, invitations and group settings',body,'<button class="btn" data-action="close-modal">Done</button>','wide',tabs);
}

function invitationText(g,l){return `${people[l.by].name} is inviting you to join “${g.name}”.\n\nGroup number: ${g.num}${g.intro?'\nGroup description: '+g.intro:''}\n\nOpen the link to view the group and ${g.policy==='approval'?'request to join':'join'}:\n${linkURL(l)}\n\n${g.policy==='invite'?'An active invitation is required to join this group.':'You can also search for the group number in Symbion to '+(g.policy==='approval'?'request to join.':'join.')}`}
function messageById(id){const c=currentConv();return c?.messages.find(m=>m.id===Number(id))}
let quoteDraft=null,attachmentNames=[];
const originalRenderChat=renderChat;
renderChat=function(){
 originalRenderChat();
 const c=currentConv();if(!c)return;
 const top=document.querySelector('.chat-top');if(!top)return;
 const existing=top.querySelectorAll('.top-static');existing.forEach((el,i)=>{const b=document.createElement('button');b.className='top-static';b.textContent=i===0?'Workspace':'♧ Commons';b.dataset.action=i===0?'workspace':'commons';b.title=i===0?'Open group workspace':'Meeting options';el.replaceWith(b)});
 const ms=document.querySelectorAll('.message');const msgs=visibleMessages(state.view.type,c);
 ms.forEach((row,i)=>{const m=msgs[i];if(!m)return;const body=row.querySelector('.message-body');const tools=document.createElement('div');tools.className='message-tools';tools.innerHTML=`<button data-action="react-message" data-id="${m.id}" title="Add reaction" aria-label="React to message">☺</button><button data-action="quote-message" data-id="${m.id}" title="Reply with quote" aria-label="Reply with quote">↩</button><button data-action="forward-message" data-id="${m.id}" title="Forward" aria-label="Forward message">↗</button>${m.from===state.uid?`<button data-action="edit-message" data-id="${m.id}" title="Edit" aria-label="Edit message">✎</button><button data-action="delete-message" data-id="${m.id}" title="Delete" aria-label="Delete message">×</button>`:''}`;body.appendChild(tools);if(m.reactions){const rs=document.createElement('div');rs.className='reaction-strip';rs.innerHTML=Object.entries(m.reactions).filter(([,ids])=>ids.length).map(([emoji,ids])=>`<button class="${ids.includes(state.uid)?'mine':''}" data-action="toggle-reaction" data-id="${m.id}" data-emoji="${emoji}">${emoji} ${ids.length}</button>`).join('');body.appendChild(rs)}});
 const composer=document.querySelector('.composer');if(composer){const left=composer.querySelector('.composer-actions>span');if(left){const b=document.createElement('button');b.className='icon-btn';b.dataset.action='attach-file';b.ariaLabel='Add images or files';b.textContent='＋';left.replaceWith(b)}const file=document.createElement('input');file.type='file';file.multiple=true;file.id='chat-file-input';file.hidden=true;composer.appendChild(file);const draft=document.createElement('div');draft.id='draft-context';composer.prepend(draft);renderDraftContext();
 if(state.view.type==='group'&&c.locked&&!canManage(c)){const note=document.createElement('p');note.className='hint-strip';note.textContent='Posting is locked. Only admins can send messages.';composer.prepend(note);composer.querySelector('textarea').disabled=true;composer.querySelector('[data-action="attach-file"]').disabled=true;composer.querySelector('[data-action="send"]').disabled=true;}}
};
function renderDraftContext(){const el=document.querySelector('#draft-context');if(!el)return;el.innerHTML=`${quoteDraft?`<div class="quote-draft"><span class="grow">Replying to ${esc(people[quoteDraft.from].name)}: ${esc(quoteDraft.text.slice(0,100))}</span><button data-action="clear-quote" aria-label="Cancel quote">×</button></div>`:''}${attachmentNames.length?`<div class="quote-draft"><span class="grow">${esc(attachmentNames.join(', '))}</span><button data-action="clear-files" aria-label="Remove attachments">×</button></div>`:''}`}
const originalSend=send;
send=function(){const c=currentConv();if(!c)return;if(state.view.type==='group'&&c.locked&&!canManage(c)){toast('Posting is locked.');return}const input=document.querySelector('#message-input');if(!input)return;let text=input.value.trim();if(!text&&!attachmentNames.length)return;if(quoteDraft)text=`> ${people[quoteDraft.from].name}: ${quoteDraft.text}\n\n${text}`;if(attachmentNames.length)text+=(text?'\n':'')+attachmentNames.map(n=>'[Attachment: '+n+']').join('\n');input.value=text;quoteDraft=null;attachmentNames=[];originalSend()};
const originalOpenConv=openConv;
openConv=function(type,id){quoteDraft=null;attachmentNames=[];originalOpenConv(type,id)};

const originalRenderModal=renderModal;
renderModal=function(){
 const m=modal;if(!m)return;let html='';
 if(m.kind==='reaction')html=modalFrame('Add reaction','',`<div class="reaction-picker">${['👍','✅','👀','❤️','🎉','💡'].map(em=>`<button data-action="toggle-reaction" data-id="${m.id}" data-emoji="${em}">${em}</button>`).join('')}</div>`,'','narrow');
 else if(m.kind==='message-edit'){const msg=messageById(m.id);html=modalFrame('Edit message','',`<textarea id="edit-message-text" autofocus>${esc(msg?.text||'')}</textarea><div id="edit-message-error" class="error"></div>`,cancelBtn+`<button class="btn primary" data-action="save-message" data-id="${m.id}">Save</button>`)}
 else if(m.kind==='forward'){const gs=state.groups.filter(g=>isMember(g)&&(!g.locked||canManage(g)));html=modalFrame('Forward message','Choose a group you have joined.',gs.map(g=>`<button class="overview-request" data-action="send-forward" data-id="${g.id}" data-message="${m.id}">${groupAvatar(g)}<span class="grow">${esc(g.name)}</span>↗</button>`).join('')||'<div class="compact-empty">No available groups</div>','<button class="btn" data-action="close-modal">Cancel</button>')}
 else if(m.kind==='commons'){const c=currentConv();html=modalFrame('Commons',`${esc(convName(state.view.type,c))} · Meeting`, '<p class="muted" style="margin-bottom:20px">Start now or schedule a lightweight group meeting.</p><div class="row"><button class="btn primary" data-action="start-meeting">Start now</button><button class="btn" data-action="schedule-meeting">Schedule meeting</button></div><details style="margin-top:18px"><summary>More meeting options</summary><label class="checkline" style="margin-top:10px"><input type="checkbox" checked>Start with microphone muted</label></details>', '<button class="btn" data-action="close-modal">Close</button>')}
 else if(m.kind==='meeting')html=modalFrame('Meeting · '+esc(convName(state.view.type,currentConv())),'Local meeting preview',`<div class="meeting-stage">${avatar(state.uid,'big')}<strong>${esc(current().name)}</strong><span class="muted tiny">You are in the meeting preview.</span></div><div class="row" style="justify-content:center;margin-top:15px"><button class="btn" data-action="meeting-toggle" aria-pressed="true">Unmute</button><button class="btn" data-action="meeting-toggle" aria-pressed="false">Camera off</button><button class="btn danger" data-action="close-modal">Leave meeting</button></div>`,'','wide');
 else if(m.kind==='schedule')html=modalFrame('Schedule meeting','',`<div class="field"><label for="meeting-title">Title</label><input id="meeting-title" value="${esc(convName(state.view.type,currentConv()))} meeting"></div><div class="field"><label for="meeting-date">Date and time</label><input id="meeting-date" type="datetime-local"></div><div id="schedule-error" class="error"></div>`,cancelBtn+'<button class="btn primary" data-action="save-meeting">Schedule</button>');
 else if(m.kind==='workspace'){const c=currentConv();c.workspace??={notes:[],tasks:[]};html=modalFrame('Workspace · '+esc(convName(state.view.type,c)),'Shared work for this conversation',`<section class="manage-section"><div class="row spread"><strong>Documents</strong><button class="btn small" data-action="new-note">New document</button></div>${c.workspace.notes.length?c.workspace.notes.map((n,i)=>`<button class="overview-request" style="margin-top:10px" data-action="edit-note" data-index="${i}">${icon('folder')}<span class="grow">${esc(n.title)}</span>↗</button>`).join(''):'<div class="compact-empty" style="margin-top:12px">No shared documents yet.</div>'}</section><section class="manage-section"><strong>Tasks</strong><div class="email-row" style="margin-top:10px"><input id="new-task" aria-label="Task title" placeholder="Add a task"><button class="btn" data-action="add-task">Add</button></div>${c.workspace.tasks.map((t,i)=>`<label class="checkline" style="margin-top:12px"><input type="checkbox" data-setting="task" data-index="${i}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through':''}">${esc(t.title)}</span></label>`).join('')}</section>${c.workspace.meetings?.length?`<section><strong>Meetings</strong>${c.workspace.meetings.map(me=>`<div class="info-card" style="margin-top:10px">${esc(me.title)}<p>${esc(me.date.replace('T',' '))}</p></div>`).join('')}</section>`:''}`,'<button class="btn" data-action="close-modal">Done</button>','wide')}
 else if(m.kind==='note'){const n=m.index==null?{title:'',text:''}:currentConv().workspace.notes[m.index];html=modalFrame(m.index==null?'New document':'Edit document','Saved only in this demo.',`<div class="field"><label for="note-title">Title</label><input id="note-title" value="${esc(n.title)}" autofocus></div><textarea id="note-text" style="min-height:180px" placeholder="Write a shared note…">${esc(n.text)}</textarea><div id="note-error" class="error"></div>`,cancelBtn+'<button class="btn primary" data-action="save-note">Save document</button>','wide')}
 if(html)document.querySelector('#modal-root').innerHTML=html;else originalRenderModal();
};

const originalAction=action;
action=async function(a,el,event){
 const id=el.dataset.id,person=el.dataset.person;
 const managed=()=>{const g=group(id);if(!g||!canManage(g)){toast('You do not have permission to manage this group.');return null}return g};
 if(a==='remove-member'){const g=managed();if(!g||person===g.owner)return;openModal({kind:'confirm',title:'Remove '+people[person].name+'?',text:'This member will lose access to the group. Previous messages stay in the conversation.',label:'Remove',run:'remove-member',id,person,danger:true,back:modal});return}
 if(a==='transfer-owner'){const g=managed(),who=document.querySelector('#transfer-person')?.value;if(!g||g.owner!==state.uid||!who)return;openModal({kind:'confirm',title:'Transfer ownership?',text:people[who].name+' will become the group owner. You will remain an admin.',label:'Transfer',run:'transfer-owner',id,person:who,back:modal});return}
 if(a==='toggle-posting'){const g=managed();if(!g)return;g.locked=!g.locked;render();toast(g.locked?'Posting locked for members.':'Posting unlocked.');return}
 if(a==='delete-group'){const g=managed();if(!g||g.owner!==state.uid)return;openModal({kind:'confirm',title:'Delete group?',text:'Delete “'+g.name+'” and its shared history for all demo users. This is different from hiding your own conversation. This action affects only local sample data.',label:'Delete group',run:'delete-group',id,danger:true,back:modal});return}
 if(a==='confirm-action'&&['remove-member','transfer-owner','delete-group','delete-message'].includes(modal?.run)){
  const m=modal,g=group(m.id);modal=null;
  if(m.run==='remove-member'&&g&&canManage(g)){g.members=g.members.filter(p=>p!==m.person);if(g.roles)delete g.roles[m.person];modal={kind:'manage',id:g.id};toast('Member removed.');}
  else if(m.run==='transfer-owner'&&g?.owner===state.uid){g.roles??={};g.roles[state.uid]='Admin';g.roles[m.person]='Admin';g.owner=m.person;modal={kind:'manage',id:g.id};toast('Ownership transferred.');}
  else if(m.run==='delete-group'&&g?.owner===state.uid){state.groups=state.groups.filter(x=>x.id!==g.id);if(state.view.type==='group'&&state.view.id===g.id)state.view={type:'none',id:''};toast('Group deleted from this demo.');}
  else if(m.run==='delete-message'){const c=currentConv();c.messages=c.messages.filter(x=>!(x.id===Number(m.id)&&x.from===state.uid));toast('Message deleted.');}
  render();return;
 }
 if(a==='react-message'){openModal({kind:'reaction',id});return}
 if(a==='toggle-reaction'){const msg=messageById(id);if(!msg)return;msg.reactions??={};const ids=msg.reactions[el.dataset.emoji]||[];msg.reactions[el.dataset.emoji]=ids.includes(state.uid)?ids.filter(id=>id!==state.uid):[...ids,state.uid];modal=null;render();return}
 if(a==='quote-message'){const msg=messageById(id);if(!msg)return;quoteDraft={from:msg.from,text:msg.text};renderDraftContext();document.querySelector('#message-input')?.focus();return}
 if(a==='clear-quote'){quoteDraft=null;renderDraftContext();return}
 if(a==='clear-files'){attachmentNames=[];renderDraftContext();return}
 if(a==='attach-file'){document.querySelector('#chat-file-input')?.click();return}
 if(a==='edit-message'){const msg=messageById(id);if(msg?.from!==state.uid)return;openModal({kind:'message-edit',id});return}
 if(a==='save-message'){const msg=messageById(id),text=document.querySelector('#edit-message-text').value.trim();if(!text){document.querySelector('#edit-message-error').textContent='Enter a message.';return}if(msg?.from!==state.uid)return;msg.text=text;modal=null;render();toast('Message updated.');return}
 if(a==='delete-message'){const msg=messageById(id);if(msg?.from!==state.uid)return;openModal({kind:'confirm',title:'Delete this message?',text:'This message will be removed for everyone in this demo conversation.',label:'Delete',run:'delete-message',id,danger:true});return}
 if(a==='forward-message'){openModal({kind:'forward',id});return}
 if(a==='send-forward'){const source=messageById(el.dataset.message),target=group(id);if(!source||!target)return;target.messages.push({id:++state.seq,from:state.uid,text:'Forwarded from '+people[source.from].name+':\n'+source.text,time:timeNow()});modal=null;render();toast('Message forwarded to '+target.name+'.');return}
 if(a==='commons'||a==='workspace'){openModal({kind:a});return}
 if(a==='start-meeting'){openModal({kind:'meeting'});return}
 if(a==='schedule-meeting'){openModal({kind:'schedule',back:{kind:'commons'}});return}
 if(a==='meeting-toggle'){const pressed=el.getAttribute('aria-pressed')==='true';el.setAttribute('aria-pressed',String(!pressed));el.textContent=el.textContent.includes('Camera')?(pressed?'Camera off':'Camera on'):(pressed?'Mute':'Unmute');return}
 if(a==='save-meeting'){const title=document.querySelector('#meeting-title').value.trim(),date=document.querySelector('#meeting-date').value;if(!title||!date){document.querySelector('#schedule-error').textContent='Enter a title and date.';return}const c=currentConv();c.workspace??={notes:[],tasks:[]};c.workspace.meetings??=[];c.workspace.meetings.push({title,date});openModal({kind:'workspace'});toast('Meeting scheduled in this demo.');return}
 if(a==='new-note'||a==='edit-note'){openModal({kind:'note',index:a==='edit-note'?Number(el.dataset.index):null,back:{kind:'workspace'}});return}
 if(a==='save-note'){const title=document.querySelector('#note-title').value.trim();if(!title){document.querySelector('#note-error').textContent='Enter a document title.';return}const c=currentConv(),n={title,text:document.querySelector('#note-text').value};c.workspace??={notes:[],tasks:[]};if(modal.index==null)c.workspace.notes.push(n);else c.workspace.notes[modal.index]=n;openModal({kind:'workspace'});toast('Document saved locally.');return}
 if(a==='add-task'){const title=document.querySelector('#new-task').value.trim();if(!title)return;currentConv().workspace.tasks.push({title,done:false});render();return}
 if(a==='fold-list'){state.folds??={};state.folds[el.dataset.list]=!state.folds[el.dataset.list];render();return}
 return originalAction(a,el,event);
};

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='transfer-person'){document.querySelector('#transfer-button').disabled=!t.value;return}
 if(t.id==='chat-file-input'){attachmentNames=Array.from(t.files).map(f=>f.name);renderDraftContext();const sendButton=document.querySelector('#send-button');if(sendButton)sendButton.disabled=!attachmentNames.length&&!document.querySelector('#message-input').value.trim();return}
 const setting=t.dataset.setting;if(!setting)return;
 if(setting==='task'){currentConv().workspace.tasks[Number(t.dataset.index)].done=t.checked;render();return}
 const g=group(t.dataset.group);if(!g||!canManage(g))return;
 if(setting==='role'){if(t.dataset.person===g.owner)return;g.roles??={};g.roles[t.dataset.person]=t.value;toast('Member role updated.');}
 if(setting==='title'){g.titles??={};g.titles[t.dataset.person]=t.value;toast('Member title updated.');}
 if(setting==='listed'){g.listed=t.checked;toast(g.listed?'Group listed in directory.':'Group hidden from directory.');}
 if(setting==='policy'){g.policy=t.value;toast('Join policy updated.');}
 render();
});

const originalRenderSidebar=renderSidebar;
renderSidebar=function(){originalRenderSidebar();const heads=document.querySelectorAll('.list-head');heads.forEach((el,i)=>{const key=i?'dm':'group',b=document.createElement('button');b.className=el.className;b.style.width='100%';b.dataset.action='fold-list';b.dataset.list=key;b.setAttribute('aria-expanded',String(!state.folds?.[key]));b.innerHTML=el.innerHTML;el.replaceWith(b);if(state.folds?.[key]){const list=i?b.nextElementSibling:document.querySelector('#sidebar .search-wrap')?.nextElementSibling;if(list)list.hidden=true;b.querySelector('.fold').textContent='›'}})};

render();const token=new URLSearchParams(location.hash.slice(1)).get('invite');if(token)openModal({kind:'invite-preview',token});
</script>
</body>
</html>

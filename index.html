<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symbion Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="review" role="toolbar" aria-label="Review">
    <span>Review</span>
    <button type="button" data-stage="h0">H0 · Day zero</button>
    <button type="button" data-stage="h1">H1 · Getting started</button>
    <button type="button" data-stage="h2">H2 · Established</button>
    <button type="button" data-stage="h3">H3 · Welcome back</button>
  </div>
  <div class="stage" id="stage">
    <aside class="rail" aria-label="Rail">
      <div class="mark" aria-hidden="true"></div>
      <button type="button" class="rail-ico" data-press="rail-home">✧</button>
      <button type="button" class="rail-ico" data-press="rail-deck">▧</button>
      <button type="button" class="rail-ico" data-press="rail-club">♧</button>
      <button type="button" class="rail-ico" data-press="rail-set">⚙</button>
    </aside>
    <aside class="side" id="side" aria-label="Sidebar"></aside>
    <div class="body" id="body"></div>
    <div class="fold" aria-hidden="true"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>

let kind = "";
function sevClass(s){ return s.startsWith("P0")?"p0":s.startsWith("P1")?"p1":s.startsWith("P2")?"p2":s.startsWith("P3")?"p3":""; }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function field(label, value){ return value ? `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>` : ""; }
function render(){
  const query = q.value.trim().toLowerCase();
  const rows = DATA.filter(r => {
    if (tool !== "全部" && r.tool !== tool && !(r.tools||"").includes(tool.split(" ")[0])) return false;
    if (sev && !(r.sev||"").startsWith(sev)) return false;
    if (kind && r.kind !== kind) return false;
    if (query && !(r.id+" "+r.problem_zh+" "+r.problem_en).toLowerCase().includes(query)) return false;
    return true;
  });
  count.textContent = rows.length + " 条";
  list.innerHTML = rows.map(r => {
    const tags = [r.kind, r.tool, r.route, r.sev, r.effort && ("工作量 "+r.effort), r.bucket, r.conf && ("置信度 "+r.conf), r.status].filter(Boolean);
    const shots = r.shots.map(s => s.video
      ? `<figure><figcaption>${s.n}. ${esc(s.kind)} · ${esc(s.round)}<br>${esc(s.caption)}</figcaption><a class="video" href="${esc(s.src)}">打开录屏 ${esc(s.name)}</a></figure>`
      : `<figure><figcaption>${s.n}. ${esc(s.kind)} · ${esc(s.round)}<br>${esc(s.caption)}</figcaption><a href="${esc(s.src)}"><img src="${esc(s.src)}" alt="${esc(s.caption)}"></a></figure>`
    ).join("");
    const en = [r.problem_en, r.sees_en, r.expected_en, r.fix_en, r.notes_en].filter(Boolean).map(esc).join("\n\n");
    return `<article id="${esc(r.id)}">
      <div class="id">${esc(r.id)}</div>
      <h2>${esc(r.problem_zh)}</h2>
      <div class="meta">${tags.map(t => `<span class="tag ${sevClass(t)}">${esc(t)}</span>`).join("")}</div>
      <dl>
        ${field("被挡住的任务", r.blocked_zh)}
        ${field("涉及工具", r.tools)}
        ${field("Citta 提示", r.prompt_zh)}
        ${field("Citta 结果", r.outcome)}
        ${field("用户看到的", r.sees_zh)}
        ${field("预期", r.expected_zh)}
        ${field("绕行办法", r.wa_zh)}
        ${field("建议修复", r.fix_zh)}
        ${field("相关编号", r.related)}
        ${field("备注", r.notes_zh)}
      </dl>
      <details><summary>英文原文</summary><div class="en">${en}</div></details>
      ${shots}
    </article>`;
  }).join("");
}
document.querySelectorAll(".bar button").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.tool){ tool = btn.dataset.tool; sev=""; kind=""; }
    else if (btn.dataset.sev){ sev = sev===btn.dataset.sev ? "" : btn.dataset.sev; tool="全部"; kind=""; }
    else if (btn.dataset.kind){ kind = kind===btn.dataset.kind ? "" : btn.dataset.kind; tool="全部"; sev=""; }
    document.querySelectorAll(".bar button").forEach(b => b.classList.remove("on"));
    if (tool==="全部" && !sev && !kind) document.querySelector('[data-tool="全部"]').classList.add("on");
    else btn.classList.add("on");
    render();
  });
});
q.addEventListener("input", render);
render();
if (location.hash) {
  const el = document.querySelector(location.hash);
  if (el) el.scrollIntoView();
}
</script>
</body>
</html>
